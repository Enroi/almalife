name: almalife

services:

  spark-master:
    build: spark/.
    environment:
      - SPARK_PUBLIC_DNS=spark-master
      - SPARK_LOCAL_HOSTNAME=spark-master
      - SPARK_MASTER_HOST=spark-master
      - SPARK_MASTER_PORT=7077
    command: [
        "/opt/spark/bin/spark-class", "org.apache.spark.deploy.master.Master"
    ]
    volumes:
      - ./test_csvs:/opt/spark/work-dir/test_csvs/
      - ./test_results:/opt/spark/work-dir/test_results/

  spark-worker:
    build: spark/.
    environment:
      - SPARK_PUBLIC_DNS=spark-worker
      - SPARK_LOCAL_HOSTNAME=spark-worker
      - SPARK_WORKER_CORES=1
      - SPARK_WORKER_MEMORY=2g
    command: [
      "/opt/spark/bin/spark-class", "org.apache.spark.deploy.worker.Worker", "spark://spark-master:7077"
    ]
    depends_on:
      - spark-master
    volumes:
      - ./test_csvs:/opt/spark/work-dir/test_csvs/
      - ./test_results:/opt/spark/work-dir/test_results/

  spark-connect:
    build: spark/.
    environment:
      - SPARK_PUBLIC_DNS=spark-connect
      - SPARK_LOCAL_HOSTNAME=spark-connect
    ports:
      - "15002:15002"
      - "4040:4040"
    command: [
      "/opt/spark/bin/spark-submit", "--class", "org.apache.spark.sql.connect.service.SparkConnectServer"
    ]
    depends_on:
      - spark-master
    volumes:
      - ./test_csvs:/opt/spark/work-dir/test_csvs/
      - ./test_results:/opt/spark/work-dir/test_results/

  postgres:
    restart: no
    image: postgres
    ports:
      - "5433:5432"
    environment:
      POSTGRES_PASSWORD: ${PG_DB_PASS}
      POSTGRES_USER: ${PG_DB_USER}
      POSTGRES_DB: ${PG_DB_NAME}
    volumes:
      - db_home:/var/lib/postgresql
      - ./postgres/docker-entrypoint-initdb.d:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PG_DB_USER}"]
      interval: 5s
      timeout: 5s
      retries: 10

  superset:
    image: apache/superset:latest
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8088:8088"
    environment:
      SUPERSET_SECRET_KEY: aX9mK2pQ7vR4tY8nB3wZ6cL1
    command: >
      sh -c "
      superset db upgrade &&
      superset fab create-admin --username admin --firstname Admin --lastname User --email admin@example.com --password admin || true &&
      superset init &&
      superset run -h 0.0.0.0 -p 8088
      "
    volumes:
      - superset_home:/app/superset_home
      - ./test_csvs:/opt/spark/work-dir/test_csvs/

volumes:
  superset_home:
  db_home:
