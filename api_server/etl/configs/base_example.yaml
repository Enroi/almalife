extract: # Описывает этап извлечения данных
  format: "csv" # 
  source: "source_test_data/test_csvs/data_1/deal.csv"
  options:
    inferSchema: "true"
    encoding: "UTF-8"
    header: "true"
    sep: ";"
  show_loaded: 10
  print_schema: "true"
  # Строки ниже по сути описывают этап Transform в ETL-процессе
  select: # Список колонок, которые нужно выбрать из источника
    - deal_number
    - contract_number
    - counterparty_id
    - product_type
    - portfolio_name
    - trader_name
    - deal_notional
    - deal_currency
    - nominal 
  drop_columns: # После загрузки можно удалить "лишние" колонки
    - deal_currency
  column_modifications:
    new_column_name: to_date('2026-01-01') # Пример создания новой колонки с помощью функций Apache Spark
  business_modification: 
    module: "etl.business_methods.worker_module"
    class: Worker
    method: do_work

load: # Описывает этап сохранения данных
  format: json
  write_mode: overwrite
  target_name: test_results/test_cvs1
  options:
    compression: "gzip"
  show_rows_before_save: 10
  print_schema: true